<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#050505}
.loading{z-index:5;transition:opacity .45s ease,visibility .45s ease}
.loading.hide{opacity:0;visibility:hidden}
.gear{width:76px;height:76px;position:relative;animation:spin 1.1s linear infinite;margin-bottom:24px}
.gear::before{content:"⚙";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:76px;line-height:1;color:#d8d8d8;filter:drop-shadow(0 0 12px #555)}
.loading-text{font-size:16px;color:#777;letter-spacing:.3px}
@keyframes spin{to{transform:rotate(360deg)}}

.result{z-index:2;opacity:0;visibility:hidden;overflow-y:auto;justify-content:flex-start;padding:28px 16px 42px;transition:opacity .55s ease,visibility .55s ease}
.result.show{opacity:1;visibility:visible}
.card{width:min(100%,560px);margin:auto;text-align:center}
.title{font-size:clamp(28px,8vw,48px);font-weight:900;line-height:1.05;letter-spacing:-1.2px;margin:4px 0 22px;text-transform:uppercase}
.photo-wrap{width:100%;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 18px 50px rgba(0,0,0,.75);border:1px solid #222}
.photo-wrap img{display:block;width:100%;height:auto}
.labels{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.label{padding:17px 14px;border-radius:15px;background:#151515;border:1px solid #292929;font-size:clamp(17px,5vw,25px);font-weight:900;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 7px 20px rgba(0,0,0,.3)}
.footer{margin-top:20px;color:#666;font-size:13px}
</style>
</head>
